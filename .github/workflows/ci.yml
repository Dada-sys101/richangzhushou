name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: daily_assistant_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_USER: daily_assistant_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://daily_assistant_ci:ci-only-password@127.0.0.1:3306/daily_assistant_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @daily-assistant/api

      - name: Build shared API contracts
        run: npm run build --workspace @daily-assistant/api-contracts

      - name: Build shared config
        run: npm run build --workspace @daily-assistant/config

      - name: Run quality gates
        run: npm run quality

      - name: Apply migrations to an empty MySQL database
        run: npm run prisma:migrate:deploy --workspace @daily-assistant/api

      - name: Run WP2 database integration tests
        run: npm run test:integration --workspace @daily-assistant/api
        env:
          TEST_DATABASE_URL: mysql://daily_assistant_ci:ci-only-password@127.0.0.1:3306/daily_assistant_ci

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: daily_assistant_e2e
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_USER: daily_assistant_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      E2E_DATABASE_URL: mysql://daily_assistant_ci:ci-only-password@127.0.0.1:3306/daily_assistant_e2e
      E2E_ADMIN_PASSWORD: CiOnlyE2eAdmin123!
      LOGIN_RATE_LIMIT_MAX: 1000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @daily-assistant/api

      - name: Build shared API contracts
        run: npm run build --workspace @daily-assistant/api-contracts

      - name: Build shared config
        run: npm run build --workspace @daily-assistant/config

      - name: Run browser smoke tests
        run: npm run test:e2e:smoke

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
