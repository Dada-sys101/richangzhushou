name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: daily_assistant_ci
          MYSQL_PASSWORD: ci-only-password
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_USER: daily_assistant_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-only-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: mysql://daily_assistant_ci:ci-only-password@127.0.0.1:3306/daily_assistant_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace @daily-assistant/api

      - name: Build shared API contracts
        run: npm run build --workspace @daily-assistant/api-contracts

      - name: Run quality gates
        run: npm run quality

      - name: Apply migrations to an empty MySQL database
        run: npm run prisma:migrate:deploy --workspace @daily-assistant/api

      - name: Run WP2 database integration tests
        run: npm run test:integration --workspace @daily-assistant/api
        env:
          TEST_DATABASE_URL: mysql://daily_assistant_ci:ci-only-password@127.0.0.1:3306/daily_assistant_ci
