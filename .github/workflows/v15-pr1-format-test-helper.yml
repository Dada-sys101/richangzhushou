name: V1.5 PR1 format test helper

on:
  push:
    branches:
      - codex/tmp-v15-pr1-setnull-output

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: codex/v15-pr1-expand-rrule
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format new integration test
        run: npx prettier --write apps/api/src/integration/v15-rrule-parent-set-null.integration.test.ts

      - name: Commit formatted test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/integration/v15-rrule-parent-set-null.integration.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git commit -m "style(pr1): format parent set-null integration test"
          git push origin HEAD:codex/v15-pr1-expand-rrule
