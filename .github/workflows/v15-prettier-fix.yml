name: V1.5 Prettier Fix

on:
  push:
    branches:
      - codex/v15-tech-selection-poc
    paths:
      - .github/workflows/v15-prettier-fix.yml

permissions:
  contents: write

jobs:
  format-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: codex/v15-tech-selection-poc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Format diagnosed PoC files only
        run: |
          npx prettier --write \
            pocs/v15-tech-selection/device-harness/index.html \
            pocs/v15-tech-selection/device-harness/app.mjs \
            pocs/v15-tech-selection/device-harness/manifest.webmanifest \
            pocs/v15-tech-selection/device-harness/sw.js \
            pocs/v15-tech-selection/lib/canonical-json.mjs \
            pocs/v15-tech-selection/lib/local-crypto.mjs \
            pocs/v15-tech-selection/lib/indexeddb-migration.mjs \
            pocs/v15-tech-selection/lib/indexeddb-migration-engine.mjs \
            pocs/v15-tech-selection/lib/indexeddb-migration-resilient.mjs \
            pocs/v15-tech-selection/scripts/browser-transaction-termination.mjs \
            pocs/v15-tech-selection/scripts/browser-web-locks.mjs \
            pocs/v15-tech-selection/scripts/generate-notices.mjs \
            pocs/v15-tech-selection/scripts/import-benchmark.mjs \
            pocs/v15-tech-selection/scripts/rrule-child.mjs \
            pocs/v15-tech-selection/tests/01-rrule.test.mjs \
            pocs/v15-tech-selection/tests/02-local-encryption.test.mjs \
            pocs/v15-tech-selection/tests/03-canonical-json.test.mjs \
            pocs/v15-tech-selection/tests/03-indexeddb-migration.test.mjs \
            pocs/v15-tech-selection/tests/03-indexeddb-faults.test.mjs \
            pocs/v15-tech-selection/tests/03-indexeddb-timing-matrix.test.mjs \
            pocs/v15-tech-selection/tests/04-import.test.mjs \
            pocs/v15-tech-selection/tests/05-web-push.test.mjs \
            pocs/v15-tech-selection/tests/06-ai-adapter.test.mjs
          git diff --check

      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pocs/v15-tech-selection/device-harness/index.html \
            pocs/v15-tech-selection/device-harness/app.mjs \
            pocs/v15-tech-selection/device-harness/manifest.webmanifest \
            pocs/v15-tech-selection/device-harness/sw.js \
            pocs/v15-tech-selection/lib/canonical-json.mjs \
            pocs/v15-tech-selection/lib/local-crypto.mjs \
            pocs/v15-tech-selection/lib/indexeddb-migration.mjs \
            pocs/v15-tech-selection/lib/indexeddb-migration-engine.mjs \
            pocs/v15-tech-selection/lib/indexeddb-migration-resilient.mjs \
            pocs/v15-tech-selection/scripts/browser-transaction-termination.mjs \
            pocs/v15-tech-selection/scripts/browser-web-locks.mjs \
            pocs/v15-tech-selection/scripts/generate-notices.mjs \
            pocs/v15-tech-selection/scripts/import-benchmark.mjs \
            pocs/v15-tech-selection/scripts/rrule-child.mjs \
            pocs/v15-tech-selection/tests/01-rrule.test.mjs \
            pocs/v15-tech-selection/tests/02-local-encryption.test.mjs \
            pocs/v15-tech-selection/tests/03-canonical-json.test.mjs \
            pocs/v15-tech-selection/tests/03-indexeddb-migration.test.mjs \
            pocs/v15-tech-selection/tests/03-indexeddb-faults.test.mjs \
            pocs/v15-tech-selection/tests/03-indexeddb-timing-matrix.test.mjs \
            pocs/v15-tech-selection/tests/04-import.test.mjs \
            pocs/v15-tech-selection/tests/05-web-push.test.mjs \
            pocs/v15-tech-selection/tests/06-ai-adapter.test.mjs
          git commit -m "style(poc): format Stage 3 remediation files"
          git push origin HEAD:codex/v15-tech-selection-poc
