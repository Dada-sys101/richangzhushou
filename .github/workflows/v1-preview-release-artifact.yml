name: V1 Preview release artifact

run-name: V1 Preview artifact from f4439131

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact approved V1 Private Preview source SHA
        required: true
        type: string
        default: f4439131b09fdec05e052536929949437f958986

permissions:
  contents: read

concurrency:
  group: v1-preview-release-artifact-f4439131
  cancel-in-progress: false

jobs:
  assemble:
    name: Assemble Linux x64 release artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: f4439131b09fdec05e052536929949437f958986
      SOURCE_PARENT_SHA: 13bfad4d32157166fa6e8f5215ce5f813a1ad67c
      REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      EXPECTED_NODE_VERSION: 24.19.0
      EXPECTED_NPM_VERSION: 11.17.0
      EXPECTED_ARCHITECTURE: x86_64
      ARTIFACT_BASENAME: daily-assistant-preview-f4439131-linux-x64

    steps:
      - name: Validate dispatch source SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${REQUESTED_SOURCE_SHA}" = "${SOURCE_SHA}"

      - name: Check out exact Preview source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 2
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Verify source identity and runner platform
        shell: bash
        run: |
          set -Eeuo pipefail

          actual_sha="$(git rev-parse HEAD)"
          actual_parent_sha="$(git rev-parse HEAD^)"
          actual_os="$(uname -s)"
          actual_arch="$(uname -m)"

          test "${actual_sha}" = "${SOURCE_SHA}"
          test "${actual_parent_sha}" = "${SOURCE_PARENT_SHA}"
          test "${actual_os}" = "Linux"
          test "${actual_arch}" = "${EXPECTED_ARCHITECTURE}"
          test -z "$(git status --short)"

      - name: Set up pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.19.0
          architecture: x64

      - name: Verify Node.js and npm versions
        shell: bash
        run: |
          set -Eeuo pipefail

          test "$(node --version)" = "v${EXPECTED_NODE_VERSION}"
          test "$(npm --version)" = "${EXPECTED_NPM_VERSION}"

      - name: Install locked build dependencies
        shell: bash
        run: npm ci

      - name: Build shared workspace packages
        shell: bash
        run: |
          set -Eeuo pipefail

          npm run build --workspace @daily-assistant/api-contracts
          npm run build --workspace @daily-assistant/config

      - name: Generate Prisma client
        shell: bash
        run: npm run prisma:generate --workspace @daily-assistant/api

      - name: Build API
        shell: bash
        run: npm run build --workspace @daily-assistant/api

      - name: Build Web
        shell: bash
        run: npm run build --workspace @daily-assistant/web

      - name: Build Admin
        shell: bash
        run: npm run build --workspace @daily-assistant/admin

      - name: Verify build outputs and unchanged source
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f apps/api/dist/main.js
          test -f apps/api/dist/generated/prisma/client.js
          test -f apps/web/dist/index.html
          test -n "$(find apps/web/dist -type f -print -quit)"
          test -f apps/admin/dist/index.html
          test -n "$(find apps/admin/dist -type f -print -quit)"
          test -f packages/api-contracts/dist/index.js
          test -f packages/config/dist/index.js
          test -z "$(git status --short)"

      - name: Install locked production dependencies
        shell: bash
        run: npm ci --omit=dev

      - name: Validate Linux production dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          npm ls --omit=dev argon2 @prisma/client @prisma/adapter-mariadb \
            @daily-assistant/api-contracts

          argon2_binary="$(
            node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const entryPath = fs.realpathSync(require.resolve("argon2"));
          const packageDirectory = path.dirname(entryPath);
          const cacheBeforeLoad = new Set(Object.keys(require.cache));
          const argon2 = require("argon2");

          if (typeof argon2.hash !== "function") {
            throw new Error("argon2.hash is unavailable");
          }

          const loadedBinaries = Object.keys(require.cache)
            .filter(
              (candidate) =>
                !cacheBeforeLoad.has(candidate) && candidate.endsWith(".node"),
            )
            .map((candidate) => fs.realpathSync(candidate));

          if (loadedBinaries.length !== 1) {
            throw new Error(
              `expected exactly one argon2 native binary, found ${loadedBinaries.length}`,
            );
          }

          const binaryPath = loadedBinaries[0];
          const relativeBinaryPath = path.relative(packageDirectory, binaryPath);

          if (
            !relativeBinaryPath ||
            relativeBinaryPath === ".." ||
            relativeBinaryPath.startsWith(`..${path.sep}`) ||
            path.isAbsolute(relativeBinaryPath)
          ) {
            throw new Error("argon2 loaded a native binary outside its package");
          }

          process.stdout.write(binaryPath);
          NODE
          )"

          test -n "${argon2_binary}"
          test -f "${argon2_binary}"
          echo "argon2 native binary: ${argon2_binary}"
          file "${argon2_binary}" | grep -Eq 'ELF 64-bit.*x86-64'

          ldd_output="$(ldd "${argon2_binary}")"
          if grep -Fq 'not found' <<< "${ldd_output}"; then
            exit 1
          fi

          node -e "const client = require('./apps/api/dist/generated/prisma/client.js'); if (typeof client.PrismaClient !== 'function') process.exit(1)"
          test -z "$(git status --short)"

      - name: Assemble release directory
        id: assemble
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_EVENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -Eeuo pipefail

          release_root="${RUNNER_TEMP}/release-staging"
          output_root="${RUNNER_TEMP}/release-output"
          release_dir="${release_root}/${ARTIFACT_BASENAME}"

          test ! -e "${release_root}"
          test ! -e "${output_root}"
          install -d -m 0755 \
            "${release_dir}/apps/api" \
            "${release_dir}/apps/api/prisma/migrations" \
            "${release_dir}/apps/web" \
            "${release_dir}/apps/admin" \
            "${release_dir}/packages/api-contracts" \
            "${release_dir}/packages/config" \
            "${output_root}"

          install -m 0644 package.json package-lock.json "${release_dir}/"
          install -m 0644 apps/api/package.json "${release_dir}/apps/api/"
          install -m 0644 apps/web/package.json "${release_dir}/apps/web/"
          install -m 0644 apps/admin/package.json "${release_dir}/apps/admin/"
          install -m 0644 packages/api-contracts/package.json \
            "${release_dir}/packages/api-contracts/"
          install -m 0644 packages/config/package.json \
            "${release_dir}/packages/config/"

          cp -a apps/api/dist "${release_dir}/apps/api/dist"
          install -m 0644 apps/api/prisma/schema.prisma \
            "${release_dir}/apps/api/prisma/schema.prisma"
          install -m 0644 apps/api/prisma/migrations/migration_lock.toml \
            "${release_dir}/apps/api/prisma/migrations/migration_lock.toml"

          frozen_migrations=(
            20260805000000_wp2_identity_capacity
            20260805080803_wp3_finance
            20260805085724_wp4_shortcuts_ocr
            20260805095154_wp5_calendar_tasks_reminders
            20260806011520_wp6_trips
            20260806074500_wp7_sync
            20260806092920_open007_account_deletion_cleanup
            20260806140000_wp9_identity_entry_simplification
          )
          for migration in "${frozen_migrations[@]}"; do
            source_migration="apps/api/prisma/migrations/${migration}"
            test -d "${source_migration}"
            cp -a "${source_migration}" \
              "${release_dir}/apps/api/prisma/migrations/${migration}"
          done

          cp -a apps/web/dist "${release_dir}/apps/web/dist"
          cp -a apps/admin/dist "${release_dir}/apps/admin/dist"
          cp -a packages/api-contracts/dist \
            "${release_dir}/packages/api-contracts/dist"
          cp -a packages/api-contracts/openapi \
            "${release_dir}/packages/api-contracts/openapi"
          cp -a packages/config/dist "${release_dir}/packages/config/dist"
          cp -a packages/config/eslint "${release_dir}/packages/config/eslint"
          cp -a packages/config/typescript "${release_dir}/packages/config/typescript"
          cp -a node_modules "${release_dir}/node_modules"

          export RELEASE_API_PACKAGE_JSON="${release_dir}/apps/api/package.json"
          node <<'NODE'
          const fs = require("node:fs");

          const packagePath = process.env.RELEASE_API_PACKAGE_JSON;
          const packageJson = JSON.parse(fs.readFileSync(packagePath, "utf8"));
          const sourceScripts = packageJson.scripts ?? {};

          const expectedSourceScripts = {
            "account-deletion:run": "tsx src/cli/account-deletion-run.ts",
            "bootstrap:admin": "tsx src/cli/bootstrap-admin.ts",
            "prisma:migrate:deploy": "prisma migrate deploy",
            "prisma:validate": "prisma validate",
            start: "node dist/main.js",
          };

          for (const [name, expected] of Object.entries(expectedSourceScripts)) {
            if (sourceScripts[name] !== expected) {
              throw new Error(`unexpected source API script ${name}`);
            }
          }

          packageJson.scripts = {
            "account-deletion:run": "node dist/cli/account-deletion-run.js",
            "bootstrap:admin": "node dist/cli/bootstrap-admin.js",
            "prisma:migrate:deploy": sourceScripts["prisma:migrate:deploy"],
            "prisma:validate": sourceScripts["prisma:validate"],
            start: sourceScripts.start,
          };

          fs.writeFileSync(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`, {
            encoding: "utf8",
            mode: 0o644,
          });
          NODE

          release_argon2_prebuilds="${release_dir}/node_modules/argon2/prebuilds"
          release_argon2_binary="${release_argon2_prebuilds}/linux-x64/argon2.glibc.node"
          test -d "${release_argon2_prebuilds}"
          test -f "${release_argon2_binary}"

          find "${release_argon2_prebuilds}" -type f \
            ! -path "${release_argon2_binary}" -delete
          find "${release_argon2_prebuilds}" -depth -type d -empty -delete

          mapfile -d '' release_argon2_binaries < <(
            find "${release_argon2_prebuilds}" -type f -name '*.node' -print0
          )
          test "${#release_argon2_binaries[@]}" -eq 1
          test "$(realpath "${release_argon2_binaries[0]}")" = \
            "$(realpath "${release_argon2_binary}")"

          export RELEASE_DIR="${release_dir}"
          export EXPECTED_RELEASE_ARGON2_BINARY="${release_argon2_binary}"
          resolved_release_argon2_binary="$(
            node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const { createRequire } = require("node:module");

          async function validate() {
            const releaseDirectory = fs.realpathSync(process.env.RELEASE_DIR);
            const expectedBinary = fs.realpathSync(
              process.env.EXPECTED_RELEASE_ARGON2_BINARY,
            );
            const releaseRequire = createRequire(
              path.join(releaseDirectory, "package.json"),
            );
            const entryPath = fs.realpathSync(releaseRequire.resolve("argon2"));
            const packageDirectory = path.dirname(entryPath);
            const cacheBeforeLoad = new Set(Object.keys(require.cache));
            const argon2 = releaseRequire("argon2");

            if (typeof argon2.hash !== "function" || typeof argon2.verify !== "function") {
              throw new Error("argon2 hash/verify API is unavailable");
            }

            const loadedBinaries = Object.keys(require.cache)
              .filter(
                (candidate) =>
                  !cacheBeforeLoad.has(candidate) && candidate.endsWith(".node"),
              )
              .map((candidate) => fs.realpathSync(candidate));

            if (loadedBinaries.length !== 1) {
              throw new Error(
                `expected exactly one staged argon2 native binary, found ${loadedBinaries.length}`,
              );
            }

            const binaryPath = loadedBinaries[0];
            const relativeBinaryPath = path.relative(packageDirectory, binaryPath);
            if (
              !relativeBinaryPath ||
              relativeBinaryPath === ".." ||
              relativeBinaryPath.startsWith(`..${path.sep}`) ||
              path.isAbsolute(relativeBinaryPath)
            ) {
              throw new Error("staged argon2 loaded a binary outside its package");
            }
            if (binaryPath !== expectedBinary) {
              throw new Error("staged argon2 resolved an unexpected native binary");
            }

            const validationInput = "daily-assistant-preview-artifact-validation";
            const digest = await argon2.hash(validationInput, {
              memoryCost: 4096,
              parallelism: 1,
              timeCost: 2,
              type: argon2.argon2id,
            });
            if (!(await argon2.verify(digest, validationInput))) {
              throw new Error("staged argon2 hash verification failed");
            }

            process.stdout.write(binaryPath);
          }

          validate().catch((error) => {
            console.error(error instanceof Error ? error.message : error);
            process.exit(1);
          });
          NODE
          )"

          test "$(realpath "${resolved_release_argon2_binary}")" = \
            "$(realpath "${release_argon2_binary}")"
          file "${release_argon2_binary}" | grep -Eq 'ELF 64-bit.*x86-64'
          release_argon2_ldd="$(ldd "${release_argon2_binary}")"
          if grep -Fq 'not found' <<< "${release_argon2_ldd}"; then
            exit 1
          fi

          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");

          const releaseDirectory = fs.realpathSync(process.env.RELEASE_DIR);
          const forbiddenPathTokens = [
            "win32",
            "windows",
            "darwin",
            "freebsd",
            "linux-arm/",
            "linux-arm64/",
          ];
          const machOMagic = new Set([
            "cafebabe",
            "bebafeca",
            "cefaedfe",
            "cffaedfe",
            "feedface",
            "feedfacf",
          ]);
          let nativeBinaryCount = 0;

          function inspect(directory) {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              const entryPath = path.join(directory, entry.name);
              if (entry.isDirectory()) {
                inspect(entryPath);
                continue;
              }
              if (!entry.isFile()) {
                continue;
              }

              const descriptor = fs.openSync(entryPath, "r");
              const header = Buffer.alloc(20);
              const bytesRead = fs.readSync(descriptor, header, 0, header.length, 0);
              fs.closeSync(descriptor);
              if (bytesRead < 4) {
                continue;
              }

              const relativePath = path.relative(releaseDirectory, entryPath);
              const relativePathLower = relativePath.toLowerCase().replaceAll("\\\\", "/");
              const magic = header.subarray(0, 4).toString("hex");
              if (header[0] === 0x4d && header[1] === 0x5a) {
                throw new Error(`PE/MZ binary is forbidden: ${relativePath}`);
              }
              if (machOMagic.has(magic)) {
                throw new Error(`Mach-O binary is forbidden: ${relativePath}`);
              }
              if (magic !== "7f454c46") {
                continue;
              }

              nativeBinaryCount += 1;
              if (forbiddenPathTokens.some((token) => relativePathLower.includes(token))) {
                throw new Error(`non-target native binary path: ${relativePath}`);
              }
              if (bytesRead < 20 || header[4] !== 2 || header[5] !== 1) {
                throw new Error(`ELF must be 64-bit little-endian: ${relativePath}`);
              }
              if (header.readUInt16LE(18) !== 0x3e) {
                throw new Error(`ELF must target x86-64: ${relativePath}`);
              }
            }
          }

          inspect(releaseDirectory);
          if (nativeBinaryCount === 0) {
            throw new Error("release contains no validated ELF native binaries");
          }
          process.stdout.write(`validated ${nativeBinaryCount} ELF x86-64 binaries\n`);
          NODE

          release_api_package="${release_dir}/apps/api/package.json"
          release_bootstrap_cli="${release_dir}/apps/api/dist/cli/bootstrap-admin.js"
          release_deletion_cli="${release_dir}/apps/api/dist/cli/account-deletion-run.js"
          test -f "${release_bootstrap_cli}"
          test -f "${release_deletion_cli}"
          node --check "${release_bootstrap_cli}"
          node --check "${release_deletion_cli}"
          node - "${release_api_package}" <<'NODE'
          const fs = require("node:fs");

          const packageJson = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const expectedScripts = {
            "account-deletion:run": "node dist/cli/account-deletion-run.js",
            "bootstrap:admin": "node dist/cli/bootstrap-admin.js",
            "prisma:migrate:deploy": "prisma migrate deploy",
            "prisma:validate": "prisma validate",
            start: "node dist/main.js",
          };
          if (JSON.stringify(packageJson.scripts) !== JSON.stringify(expectedScripts)) {
            throw new Error("release API scripts do not match the runtime allowlist");
          }
          NODE

          mapfile -t packaged_migrations < <(
            find "${release_dir}/apps/api/prisma/migrations" \
              -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort
          )
          test "${#packaged_migrations[@]}" -eq "${#frozen_migrations[@]}"
          test "$(printf '%s\n' "${packaged_migrations[@]}")" = \
            "$(printf '%s\n' "${frozen_migrations[@]}" | LC_ALL=C sort)"
          test -f "${release_dir}/apps/api/prisma/schema.prisma"
          test -f "${release_dir}/apps/api/prisma/migrations/migration_lock.toml"
          test ! -e "${release_dir}/apps/api/prisma/seed.ts"
          test -z "$(find "${release_dir}/apps/api/prisma" \
            -type f -iname 'README*' -print -quit)"

          test -z "$(find "${release_dir}" \
            \( -name '.git' -o -name '.env' -o -name '.env.*' \
               -o -name '.npmrc' -o -name 'id_rsa' -o -name 'id_ed25519' \
               -o -iname '*.pem' -o -iname '*.key' -o -iname '*.p12' \
               -o -iname '*.pfx' \) -print -quit)"
          test -z "$(find "${release_dir}" \
            -path "${release_dir}/node_modules" -prune -o \
            \( -name '.github' -o -name 'coverage' -o -name 'test-results' \
               -o -name 'playwright-report' -o -name '.cache' \
               -o -name '.turbo' -o -name '_temp' \
               -o -name '*.tsbuildinfo' \) -print -quit)"

          set +e
          secret_content_matches="$(grep -RIlE --exclude='*.map' \
            -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|AKIA[0-9A-Z]{16}|LTAI[A-Za-z0-9]{12,}|github_pat_[A-Za-z0-9_]{20,}|gh[pousr]_[A-Za-z0-9]{20,}' \
            "${release_dir}/apps" "${release_dir}/packages" \
            "${release_dir}/package.json" "${release_dir}/package-lock.json")"
          secret_scan_status=$?
          set -e
          if [ "${secret_scan_status}" -eq 0 ]; then
            echo "credential-like content found in release-owned files" >&2
            printf '%s\n' "${secret_content_matches}" >&2
            exit 1
          fi
          test "${secret_scan_status}" -eq 1

          export METADATA_PATH="${release_dir}/RELEASE-METADATA.json"
          export BUILD_TIMESTAMP="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node <<'NODE'
          const fs = require("node:fs");

          const metadata = {
            schemaVersion: 1,
            product: "Daily Assistant V1 Private Preview",
            sourceSha: process.env.SOURCE_SHA,
            sourceParentSha: process.env.SOURCE_PARENT_SHA,
            platform: "linux-x64",
            runner: "ubuntu-24.04",
            nodeVersion: process.env.EXPECTED_NODE_VERSION,
            npmVersion: process.env.EXPECTED_NPM_VERSION,
            artifactBasename: process.env.ARTIFACT_BASENAME,
            repository: process.env.REPOSITORY,
            workflowRef: process.env.WORKFLOW_REF,
            workflowEventSha: process.env.WORKFLOW_EVENT_SHA,
            runId: process.env.RUN_ID,
            runAttempt: process.env.RUN_ATTEMPT,
            buildTimestamp: process.env.BUILD_TIMESTAMP,
            deploymentPerformed: false,
          };

          fs.writeFileSync(
            process.env.METADATA_PATH,
            `${JSON.stringify(metadata, null, 2)}\n`,
            { encoding: "utf8", mode: 0o644 },
          );
          NODE

          (
            cd "${release_dir}"
            find . -mindepth 1 -printf '%y %p -> %l\n' \
              | LC_ALL=C sort > RELEASE-INVENTORY.txt
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 -r sha256sum > SHA256SUMS
          )

          test -s "${release_dir}/RELEASE-METADATA.json"
          test -s "${release_dir}/RELEASE-INVENTORY.txt"
          test -s "${release_dir}/SHA256SUMS"
          grep -Fq ' ./apps/api/dist/main.js' "${release_dir}/SHA256SUMS"
          grep -Fq ' ./apps/web/dist/index.html' "${release_dir}/SHA256SUMS"
          grep -Fq ' ./apps/admin/dist/index.html' "${release_dir}/SHA256SUMS"
          (
            cd "${release_dir}"
            sha256sum --check SHA256SUMS
          )

          source_date_epoch="$(git show -s --format=%ct "${SOURCE_SHA}")"
          archive_path="${output_root}/${ARTIFACT_BASENAME}.tar.gz"
          tar \
            --sort=name \
            --mtime="@${source_date_epoch}" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -C "${release_root}" \
            -czf "${archive_path}" \
            "${ARTIFACT_BASENAME}"

          (
            cd "${output_root}"
            sha256sum "${ARTIFACT_BASENAME}.tar.gz" \
              > "${ARTIFACT_BASENAME}.tar.gz.sha256"
            sha256sum --check "${ARTIFACT_BASENAME}.tar.gz.sha256"
          )

          archive_inventory="${output_root}/ARCHIVE-CONTENTS.txt"
          tar -tzf "${archive_path}" > "${archive_inventory}"
          grep -Fxq "${ARTIFACT_BASENAME}/apps/api/dist/main.js" \
            "${archive_inventory}"
          grep -Fxq "${ARTIFACT_BASENAME}/apps/web/dist/index.html" \
            "${archive_inventory}"
          grep -Fxq "${ARTIFACT_BASENAME}/apps/admin/dist/index.html" \
            "${archive_inventory}"
          rm -- "${archive_inventory}"

          test -z "$(git status --short)"

          echo "artifact_path=${archive_path}" >> "${GITHUB_OUTPUT}"
          echo "checksum_path=${archive_path}.sha256" >> "${GITHUB_OUTPUT}"

      - name: Upload verified release artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: daily-assistant-preview-f4439131-linux-x64
          path: |
            ${{ steps.assemble.outputs.artifact_path }}
            ${{ steps.assemble.outputs.checksum_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          overwrite: false
