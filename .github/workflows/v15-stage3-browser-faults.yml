name: V1.5 Stage 3 Browser Faults

on:
  workflow_dispatch:
  push:
    branches:
      - codex/v15-tech-selection-poc
    paths:
      - "pocs/v15-tech-selection/lib/**"
      - "pocs/v15-tech-selection/scripts/browser-transaction-termination.mjs"
      - "pocs/v15-tech-selection/scripts/browser-web-locks.mjs"
      - ".github/workflows/v15-stage3-browser-faults.yml"

permissions:
  contents: read

jobs:
  chromium-faults:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run page-close and renderer-crash transaction tests
        run: node pocs/v15-tech-selection/scripts/browser-transaction-termination.mjs

      - name: Run real Web Locks migration concurrency tests
        run: node pocs/v15-tech-selection/scripts/browser-web-locks.mjs

      - name: Upload browser fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage3-browser-fault-evidence
          path: |
            pocs/v15-tech-selection/results/03-browser-transaction-termination.json
            pocs/v15-tech-selection/results/03-browser-web-locks.json
          if-no-files-found: error
          retention-days: 30
