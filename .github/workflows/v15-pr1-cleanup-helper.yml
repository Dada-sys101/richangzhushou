name: V1.5 PR1 cleanup helper

on:
  push:
    branches:
      - codex/tmp-v15-pr1-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR1 branch
        uses: actions/checkout@v4
        with:
          ref: codex/v15-pr1-expand-rrule
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore unrelated formatting and remove extra document
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/api/prisma/schema.prisma')
          text = path.read_text()
          old = '  lastUsedAt        DateTime? @map("last_used_at")\n'
          new = '  lastUsedAt       DateTime? @map("last_used_at")\n'
          if old not in text:
              raise SystemExit('Expected unrelated formatting diff was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm docs/41-v15-pr1-rrule-expand.md

      - name: Commit cleanup to PR1 branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/prisma/schema.prisma
          git commit -m "chore(pr1): remove unrelated diff and extra document"
          git push origin HEAD:codex/v15-pr1-expand-rrule
