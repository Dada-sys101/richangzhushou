      summary: Get a packing item in the current user scope
      tags: [Trips]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      responses:
        "200":
          description: Packing item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackingItemSummary" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
    patch:
      operationId: updatePackingItem
      summary: Update a packing item in the current user scope
      tags: [Trips]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PackingItemUpdateRequest" }
      x-error-codes: [VALIDATION_ERROR, VERSION_CONFLICT]
      responses:
        "200":
          description: Packing item updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackingItemSummary" }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/ApiError" }
    delete:
      operationId: deletePackingItem
      summary: Delete a packing item in the current user scope
      tags: [Trips]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      responses:
        "204": { description: Packing item deleted }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
  /packing-items/{id}/restore:
    post:
      operationId: restorePackingItem
      summary: Restore a soft-deleted packing item in the current user scope
      tags: [Trips]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      responses:
        "200":
          description: Packing item restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PackingItemSummary" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
  /attachments/upload-intents:
    post:
      operationId: createAttachmentUploadIntent
      summary: Create a short-lived attachment upload intent
      tags: [Attachments]
      description: >-
        Creates a short-lived, one-time upload intent for a user-owned
        attachment. The response contains an upload token used exactly once by
        the content endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/AttachmentUploadIntentRequest" }
      x-error-codes: [ATTACHMENT_TYPE_NOT_ALLOWED, ATTACHMENT_TOO_LARGE]
      responses:
        "201":
          description: Upload intent created with a one-time upload token
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AttachmentUploadIntentResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
        "413": { $ref: "#/components/responses/ApiError" }
  /attachments/{id}/content:
    put:
      operationId: uploadAttachmentContent
      summary: Upload raw attachment bytes with a one-time upload token
      tags: [Attachments]
      description: >-
        Streams the raw file bytes to the pending attachment. The upload token
        is single-use, expires with the intent, and is never stored in plaintext.
      security: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - name: uploadToken
          in: query
          required: true
          schema: { type: string, minLength: 16, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      x-error-codes:
        [
          UPLOAD_TOKEN_INVALID,
          UPLOAD_INTENT_EXPIRED,
          ATTACHMENT_TOO_LARGE,
          ATTACHMENT_NOT_READY,
        ]
      responses:
        "204": { description: Attachment content stored and verified }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "410": { $ref: "#/components/responses/ApiError" }
        "413": { $ref: "#/components/responses/ApiError" }
  /attachments/{id}/complete:
    post:
      operationId: completeAttachmentUpload
      summary: Confirm an owned attachment upload before use
      tags: [Attachments]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      description: >-
        Marks the uploaded attachment as scanned and usable. Completion is
        required before OCR may read the attachment.
      x-error-codes:
        [ATTACHMENT_NOT_READY, ATTACHMENT_SCAN_FAILED, RESOURCE_NOT_FOUND]
      responses:
        "200":
          description: Upload completed and scan status finalized
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/AttachmentCompleteResponse" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/ApiError" }
        "422": { $ref: "#/components/responses/ApiError" }
  /attachments/{id}:
    delete:
      operationId: deleteAttachment
      summary: Delete an attachment in the current user scope
      tags: [Attachments]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      description: Soft-deletes the attachment and removes its stored object.
      responses:
        "204": { description: Attachment deleted }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
  /sync/changes:
    get:
      operationId: listSyncChanges
      summary: List current-user changes after a sync cursor
      tags: [Sync]
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200": { description: Ordered changes and next cursor }
  /sync/mutations:
    post:
      operationId: applySyncMutations
      summary: Idempotently apply an ordered batch of current-user mutations
      tags: [Sync]
      x-error-codes: [IDEMPOTENCY_CONFLICT, VERSION_CONFLICT]
      responses:
        "200": { description: Per-mutation results }
        "409": { $ref: "#/components/responses/ApiError" }
  /sync/status:
    get:
      operationId: getSyncStatus
      summary: Get current-user sync status without exposing other users
      tags: [Sync]
      responses:
        "200": { description: Sync status }
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      summary: Get aggregate administrative health without user content
      tags: [Admin]
      responses:
        "200":
          description: Aggregate dashboard
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminDashboardResponse" }
  /admin/invites:
    get:
      operationId: listAdminInvites
      summary: List invitation metadata as an administrator
      tags: [Admin]
      responses:
        "200":
          description: Invitation metadata without plaintext codes
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InviteSummary" }
    post:
      operationId: createAdminInvite
      summary: Create an invitation as an administrator
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteCreateRequest" }
      x-error-codes: [ADMIN_ACTION_REQUIRES_REASON]
      responses:
        "201":
          description: Invitation created; plaintext shown exactly once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InviteCreatedResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
  /admin/invites/{id}/revoke:
    post:
      operationId: revokeAdminInvite
      summary: Revoke an invitation as an administrator
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "204": { description: Invitation revoked }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
  /admin/users:
    get:
      operationId: listAdminUsers
      summary: List account metadata without private user content
      tags: [Admin]
      responses:
        "200":
          description: Account metadata with masked emails and no content
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminUserSummary" }
  /admin/users/{id}/suspend:
    post:
      operationId: suspendAdminUser
      summary: Suspend an account without releasing capacity
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "204": { description: Account suspended }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
  /admin/users/{id}/close:
    post:
      operationId: closeAdminUser
      summary: Close an account and release capacity
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      responses:
        "204": { description: Account closed }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
  /admin/users/{id}/reopen:
    post:
      operationId: reopenAdminUser
      summary: Reopen an account after rechecking global capacity
      tags: [Admin]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminReasonRequest" }
      x-error-codes: [REOPEN_CAPACITY_REACHED, ADMIN_ACTION_REQUIRES_REASON]
      responses:
        "204": { description: Account reopened }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/ApiError" }
  /admin/settings/registration:
    get:
      operationId: getAdminRegistrationSettings
      summary: Get registration and capacity settings
      tags: [Admin]
      responses:
        "200":
          description: Registration settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationSettings" }
    patch:
      operationId: updateAdminRegistrationSettings
      summary: Update registration and capacity settings with audit
      tags: [Admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/UpdateRegistrationSettingsRequest" }
      x-error-codes: [SETTING_LOWER_THAN_USAGE]
      responses:
        "200":
          description: Registration settings updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationSettings" }
        "400": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /admin/audits:
    get:
      operationId: listAdminAudits
      summary: List redacted administrative audit events
      tags: [Admin]
      responses:
        "200":
          description: Redacted audit events
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AdminAuditEntry" }
  /admin/health:
    get:
      operationId: getAdminHealth
      summary: Get redacted dependency readiness as an administrator
      tags: [Admin]
      responses:
        "200":
          description: Redacted dependency readiness
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminHealthResponse" }
components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived access token; refresh secrets are never stored in JavaScript storage.
    refreshCookie:
      type: apiKey
      in: cookie
      name: da_refresh
      description: HttpOnly, Secure in production, SameSite=Lax, rotated refresh-session cookie.
    shortcutToken:
      type: http
      scheme: bearer
      description: Revocable device credential with endpoint-specific least-privilege scopes.
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Identifier" }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string, minLength: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Month:
      name: month
      in: query
      required: false
      schema: { $ref: "#/components/schemas/Month" }
    TransactionTypeQuery:
      name: type
      in: query
      required: false
      schema: { $ref: "#/components/schemas/TransactionType" }
    CategoryKindQuery:
      name: kind
      in: query
      required: false
      schema: { $ref: "#/components/schemas/CategoryKind" }
    CategoryId:
      name: categoryId
      in: query
      required: false
      schema: { $ref: "#/components/schemas/Identifier" }
    AccountId:
      name: accountId
      in: query
      required: false
      schema: { $ref: "#/components/schemas/Identifier" }
    IncludeDeleted:
      name: includeDeleted
      in: query
      required: false
      schema: { type: boolean, default: false }
    IncludeArchived:
      name: includeArchived
      in: query
      required: false
      schema: { type: boolean, default: false }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 16, maxLength: 128 }
    DraftStatusQuery:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/DraftStatus" }
    CalendarDate:
      name: date
      in: query
      required: false
      schema: { type: string, pattern: "^\\d{4}-\\d{2}-\\d{2}$" }
    CalendarEventStatusQuery:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/CalendarEventStatus" }
    TaskStatusQuery:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/TaskStatus" }
    ReminderStatusQuery:
      name: status
      in: query
      required: false
      schema: { $ref: "#/components/schemas/ReminderStatus" }
  responses:
    ApiError:
      description: Structured, non-sensitive API error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ResourceNotFound:
      description: Resource does not exist or is outside the current user scope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
          example:
            code: RESOURCE_NOT_FOUND
            message: Resource not found
            requestId: req_example
  schemas:
    Identifier:
      type: string
      minLength: 1
      examples: ["01JEXAMPLE0000000000000000"]
    IsoDateTime:
      type: string
      format: date-time
      examples: ["2026-08-05T01:00:00.000Z"]
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      examples: ["123.45"]
    HealthResponse:
      type: object
      additionalProperties: false
      required: [service, status]
      properties:
        service: { type: string, const: daily-assistant-api }
        status: { type: string, const: ok }
    FieldError:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          $ref: "#/components/schemas/ApiErrorCode"
        message: { type: string }
        requestId: { type: string, minLength: 1 }
        fieldErrors:
          type: array
          items: { $ref: "#/components/schemas/FieldError" }
    ApiErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - RATE_LIMITED
        - REGISTRATION_DISABLED
        - CAPACITY_REACHED
        - INVITE_INVALID
        - INVITE_EXPIRED
        - INVITE_EXHAUSTED
        - EMAIL_ALREADY_REGISTERED
        - INVALID_CREDENTIALS
        - ACCOUNT_NOT_ACTIVE
        - REFRESH_TOKEN_REQUIRED
        - REFRESH_TOKEN_INVALID
        - RECOVERY_TOKEN_INVALID
        - RECOVERY_TOKEN_EXPIRED
        - RECOVERY_TOKEN_USED
        - REOPEN_CAPACITY_REACHED
        - REOPEN_NOT_ALLOWED
        - INVALID_STATE
        - SETTING_LOWER_THAN_USAGE
        - ADMIN_ACTION_REQUIRES_REASON
        - IDEMPOTENCY_CONFLICT
        - VERSION_CONFLICT
        - DUPLICATE_RESOURCE
        - DRAFT_CONFIRMATION_REQUIRED
        - CREDENTIAL_INVALID
        - CREDENTIAL_REVOKED
        - OCR_UNAVAILABLE
        - ATTACHMENT_TYPE_NOT_ALLOWED
        - ATTACHMENT_TOO_LARGE
        - ATTACHMENT_SCAN_FAILED
        - ATTACHMENT_NOT_READY
        - DRAFT_NOT_EDITABLE
        - UPLOAD_INTENT_EXPIRED
        - UPLOAD_TOKEN_INVALID
        - CONFIRMATION_TOKEN_INVALID
        - CONFIRMATION_TOKEN_EXPIRED
        - RESOURCE_NOT_FOUND
        - INTERNAL_ERROR
    Month:
      type: string
      pattern: "^(19|20)\\d{2}-(0[1-9]|1[0-2])$"
      examples: ["2026-08"]
      description: Natural month in the Asia/Shanghai business time zone.
    CategoryKind:
      type: string
      enum: [EXPENSE, INCOME]
    FinancialAccountKind:
      type: string
      enum: [CASH, DEBIT_CARD, CREDIT_CARD, DIGITAL_WALLET, OTHER]
    CategorySummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          kind,
          name,
          color,
          isArchived,
          version,
          createdAt,
          updatedAt,
          deletedAt,
        ]
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        kind: { $ref: "#/components/schemas/CategoryKind" }
        name: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string, minLength: 4, maxLength: 7 }
        isArchived: { type: boolean }
        version: { type: integer, minimum: 1 }
        createdAt: { $ref: "#/components/schemas/IsoDateTime" }
        updatedAt: { $ref: "#/components/schemas/IsoDateTime" }
        deletedAt:
          anyOf:
            - { $ref: "#/components/schemas/IsoDateTime" }
            - { type: "null" }
    CategoryCreateRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind: { $ref: "#/components/schemas/CategoryKind" }
        name: { type: string, minLength: 1, maxLength: 40 }
        color:
          anyOf:
            - {
                type: string,
                minLength: 4,
                maxLength: 7,
                pattern: "^#[0-9A-Fa-f]{6}$",
              }
            - { type: "null" }
    CategoryUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        kind: { $ref: "#/components/schemas/CategoryKind" }
        name: { type: string, minLength: 1, maxLength: 40 }
        color:
          anyOf:
            - {
                type: string,
                minLength: 4,
                maxLength: 7,
                pattern: "^#[0-9A-Fa-f]{6}$",
              }
            - { type: "null" }
        isArchived: { type: boolean }
        version: { type: integer, minimum: 1 }
    CategoryListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CategorySummary" }
    FinancialAccountSummary:
      type: object
      additionalProperties: false
      required:
        [id, name, kind, isArchived, version, createdAt, updatedAt, deletedAt]
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        name: { type: string, minLength: 1, maxLength: 40 }
        kind: { $ref: "#/components/schemas/FinancialAccountKind" }
        isArchived: { type: boolean }
        version: { type: integer, minimum: 1 }
        createdAt: { $ref: "#/components/schemas/IsoDateTime" }
        updatedAt: { $ref: "#/components/schemas/IsoDateTime" }
        deletedAt:
          anyOf:
            - { $ref: "#/components/schemas/IsoDateTime" }
            - { type: "null" }
    FinancialAccountCreateRequest:
      type: object
      additionalProperties: false
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        kind: { $ref: "#/components/schemas/FinancialAccountKind" }
    FinancialAccountUpdateRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        kind: { $ref: "#/components/schemas/FinancialAccountKind" }
        isArchived: { type: boolean }
        version: { type: integer, minimum: 1 }
    FinancialAccountListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/FinancialAccountSummary" }
    TransactionSummary:
      type: object
      additionalProperties: false
      required:
        [
          id,
          type,
          status,
          amount,
          currency,
          categoryId,
          accountId,
          merchant,
          occurredAt,
          note,
          source,
          originalTransactionId,
          isUnlinkedRefund,
          sourceFingerprint,
          version,
          createdAt,
          updatedAt,
          deletedAt,
        ]
      properties:
        id: { $ref: "#/components/schemas/Identifier" }
        type: { $ref: "#/components/schemas/TransactionType" }
        status: { $ref: "#/components/schemas/RecordStatus" }
        amount: { $ref: "#/components/schemas/Money" }
        currency: { type: string, minLength: 3, maxLength: 3 }
        categoryId:
          anyOf:
            - { $ref: "#/components/schemas/Identifier" }
            - { type: "null" }
        accountId:
          anyOf:
            - { $ref: "#/components/schemas/Identifier" }
            - { type: "null" }
        merchant:
          anyOf:
            - { type: string, maxLength: 100 }
            - { type: "null" }
        occurredAt: { $ref: "#/components/schemas/IsoDateTime" }
        note:
          anyOf:
            - { type: string, maxLength: 500 }
            - { type: "null" }
        source: { $ref: "#/components/schemas/RecordSource" }
        originalTransactionId:
          anyOf:
            - { $ref: "#/components/schemas/Identifier" }
            - { type: "null" }
        isUnlinkedRefund: { type: boolean }
        sourceFingerprint:
          anyOf:
            - { type: string, minLength: 8, maxLength: 128 }
            - { type: "null" }
        tripId:
          anyOf:
            - { $ref: "#/components/schemas/Identifier" }
            - { type: "null" }
        version: { type: integer, minimum: 1 }
        createdAt: { $ref: "#/components/schemas/IsoDateTime" }
        updatedAt: { $ref: "#/components/schemas/IsoDateTime" }
        deletedAt:
          anyOf:
            - { $ref: "#/components/schemas/IsoDateTime" }
            - { type: "null" }
    TransactionCreateRequest:
      type: object
      additionalProperties: false
      required: [type, amount]
      properties:
        type: { $ref: "#/components/schemas/TransactionType" }
        amount: { $ref: "#/components/schemas/Money" }
        currency:
          anyOf:
            - { type: string, minLength: 3, maxLength: 3, default: CNY }
            - { type: "null" }
        categoryId:
          anyOf:
            - { $ref: "#/components/schemas/Identifier" }
            - { type: "null" }
        accountId:
          anyOf:
            - { $ref: "#/components/schemas/Identifier" }
            - { type: "null" }
        merchant:
          anyOf:
            - { type: string, maxLength: 100 }
            - { type: "null" }
        occurredAt:
          anyOf:
            - { $ref: "#/components/schemas/IsoDateTime" }
            - { type: "null" }
        note:
          anyOf:
            - { type: string, maxLength: 500 }
            - { type: "null" }
        source: { $ref: "#/components/schemas/RecordSource" }
        originalTransactionId:
          anyOf:
            - { $ref: "#/components/schemas/Identifier" }
            - { type: "null" }
        isUnlinkedRefund: { type: boolean }
        sourceFingerprint:
          anyOf:
            - { type: string, minLength: 8, maxLength: 128 }
            - { type: "null" }
        tripId:
          anyOf:
            - { $ref: "#/components/schemas/Identifier" }
            - { type: "null" }
        clientMutationId:
          anyOf:
            - { type: string, minLength: 16, maxLength: 128 }
            - { type: "null" }
    TransactionUpdateRequest:
      type: object
      additionalProperties: false
