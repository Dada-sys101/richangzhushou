openapi: 3.1.0
info:
  title: Daily Assistant API
  version: 0.1.0
  summary: Daily Assistant V1 API contract
  description: >-
    WP2 implements authentication, account lifecycle, capacity, invites, and admin
    operations. WP3 implements finance. WP4 implements drafts, shortcuts, and
    attachments. WP5 implements calendar events, tasks, and reminders. Trips and
    sync remain contract-only for later work packages. IDs are strings,
    timestamps are ISO 8601, and money is a fixed-point decimal string.
servers:
  - url: /api/v1
    description: Versioned API base path
security:
  - accessToken: []
tags:
  - name: Health
    description: Infrastructure liveness and readiness contracts.
  - name: Authentication
    description: Registration and session lifecycle contracts.
  - name: Account
    description: Current-user account and session controls.
  - name: Finance
    description: Transaction, category, account, budget, and summary contracts.
  - name: Drafts
    description: User-confirmed OCR, AI, text, and manual draft contracts.
  - name: Shortcuts
    description: Revocable device credentials and idempotent Apple Shortcut contracts.
  - name: Calendar
    description: User-scoped calendar event contracts.
  - name: Tasks
    description: User-scoped task lifecycle contracts.
  - name: Reminders
    description: User-scoped reminder scheduling contracts.
  - name: Trips
    description: User-scoped trips, itinerary items, and packing contracts.
  - name: Attachments
    description: Safe upload-intent and attachment lifecycle contracts.
  - name: Sync
    description: Offline mutation, cursor, idempotency, and conflict contracts.
  - name: Admin
    description: Metadata-only administration and redacted audit contracts.
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check API liveness without exposing dependency details
      tags: [Health]
      security: []
      responses:
        "200":
          description: API process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /auth/register:
    post:
      operationId: register
      summary: Register with an invitation subject to global capacity
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      x-error-codes:
        [
          REGISTRATION_DISABLED,
          CAPACITY_REACHED,
          INVITE_INVALID,
          INVITE_EXPIRED,
          INVITE_EXHAUSTED,
          EMAIL_ALREADY_REGISTERED,
          RATE_LIMITED,
        ]
      responses:
        "201":
          description: Account created and session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "410": { $ref: "#/components/responses/ApiError" }
        "429": { $ref: "#/components/responses/ApiError" }
  /auth/login:
    post:
      operationId: login
      summary: Create an authenticated session
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      x-error-codes: [INVALID_CREDENTIALS, ACCOUNT_NOT_ACTIVE, RATE_LIMITED]
      responses:
        "200":
          description: Session created with a refresh cookie and access token
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionResponse" }
        "401": { $ref: "#/components/responses/ApiError" }
        "403": { $ref: "#/components/responses/ApiError" }
        "429": { $ref: "#/components/responses/ApiError" }
        default: { $ref: "#/components/responses/ApiError" }
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh session and issue an access token
      tags: [Authentication]
      security:
        - refreshCookie: []
      x-error-codes: [REFRESH_TOKEN_REQUIRED, REFRESH_TOKEN_INVALID]
      responses:
        "200":
          description: Session rotated and access token issued
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionResponse" }
        "401": { $ref: "#/components/responses/ApiError" }
        default: { $ref: "#/components/responses/ApiError" }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh session
      tags: [Authentication]
      security:
        - refreshCookie: []
      responses:
        "204":
          description: Session revoked and cookie cleared
          headers:
            Set-Cookie:
              schema: { type: string }
        default: { $ref: "#/components/responses/ApiError" }
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      summary: Request a non-enumerating password reset
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordRequest" }
      x-error-codes: [RATE_LIMITED]
      responses:
        "202":
          description: Accepted regardless of account existence to avoid enumeration
        "429": { $ref: "#/components/responses/ApiError" }
        default: { $ref: "#/components/responses/ApiError" }
  /auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset a password using a single-use secret
      tags: [Authentication]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordRequest" }
      x-error-codes:
        [RECOVERY_TOKEN_INVALID, RECOVERY_TOKEN_EXPIRED, RECOVERY_TOKEN_USED]
      responses:
        "204": { description: Password reset }
        "400": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "410": { $ref: "#/components/responses/ApiError" }
        default: { $ref: "#/components/responses/ApiError" }
  /me:
    get:
      operationId: getCurrentUser
      summary: Get the current account summary
      tags: [Account]
      responses:
        "200":
          description: Current account summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserSummary" }
        default: { $ref: "#/components/responses/ApiError" }
  /me/close:
    post:
      operationId: closeCurrentAccount
      summary: Close the current account and release capacity
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseAccountRequest" }
      x-error-codes: [INVALID_CREDENTIALS]
      responses:
        "204": { description: Account closed }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        default: { $ref: "#/components/responses/ApiError" }
  /me/reopen:
    post:
      operationId: reopenCurrentAccount
      summary: Reopen the current account after rechecking capacity
      tags: [Account]
      description: >-
        Public, single-use recovery path for a CLOSED account. The account must
        first obtain a short-lived recovery credential (for example via the
        password recovery mail flow) and remains closed until capacity is
        rechecked atomically.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReopenAccountRequest" }
      x-error-codes:
        [
          RECOVERY_TOKEN_INVALID,
          RECOVERY_TOKEN_EXPIRED,
          RECOVERY_TOKEN_USED,
          REOPEN_CAPACITY_REACHED,
          REOPEN_NOT_ALLOWED,
        ]
      responses:
        "200":
          description: Account reopened and a new session issued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
        "410": { $ref: "#/components/responses/ApiError" }
        default: { $ref: "#/components/responses/ApiError" }
  /me/request-deletion:
    post:
      operationId: requestCurrentAccountDeletion
      summary: Request delayed deletion of the current account
      tags: [Account]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestDeletionRequest" }
      x-error-codes: [INVALID_CREDENTIALS]
      responses:
        "202": { description: Deletion requested and sessions revoked }
        "400": { $ref: "#/components/responses/ApiError" }
        "401": { $ref: "#/components/responses/ApiError" }
        default: { $ref: "#/components/responses/ApiError" }
  /me/sessions:
    delete:
      operationId: revokeAllSessions
      summary: Revoke every session owned by the current user
      tags: [Account]
      responses:
        "204": { description: All sessions revoked }
        default: { $ref: "#/components/responses/ApiError" }
  /me/sessions/{sessionId}:
    delete:
      operationId: revokeSession
      summary: Revoke one session owned by the current user
      tags: [Account]
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: Session revoked }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
  /transactions:
    get:
      operationId: listTransactions
      summary: List transactions in the current user scope
      tags: [Finance]
      description: >-
        Returns confirmed transactions owned by the current user, ordered by
        occurredAt descending, excluding soft-deleted records unless
        includeDeleted=true. Money values are fixed-point decimal strings.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Month"
        - $ref: "#/components/parameters/TransactionTypeQuery"
        - $ref: "#/components/parameters/CategoryId"
        - $ref: "#/components/parameters/AccountId"
        - $ref: "#/components/parameters/IncludeDeleted"
      responses:
        "200":
          description: Paginated transactions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionListResponse" }
        default: { $ref: "#/components/responses/ApiError" }
    post:
      operationId: createTransaction
      summary: Create a transaction in the current user scope
      tags: [Finance]
      description: >-
        Creates a CONFIRMED transaction. Amounts are positive fixed-point
        strings; refunds must reference an original expense or be marked as
        unlinked. A possible duplicate is returned as a warning, never
        auto-deleted. clientMutationId enables idempotent replays.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionCreateRequest" }
      x-error-codes:
        [
          VALIDATION_ERROR,
          INVALID_STATE,
          IDEMPOTENCY_CONFLICT,
          DUPLICATE_RESOURCE,
          RESOURCE_NOT_FOUND,
        ]
      responses:
        "201":
          description: Transaction created (or prior identical result replayed)
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/TransactionCreatedResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/ApiError" }
        default: { $ref: "#/components/responses/ApiError" }
  /transactions/{id}:
    get:
      operationId: getTransaction
      summary: Get a transaction in the current user scope
      tags: [Finance]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      responses:
        "200":
          description: Transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionSummary" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
    patch:
      operationId: updateTransaction
      summary: Update a transaction in the current user scope
      tags: [Finance]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      description: >-
        Updates a transaction owned by the current user. The request must carry
        the current version; a stale version returns VERSION_CONFLICT.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransactionUpdateRequest" }
      x-error-codes:
        [VALIDATION_ERROR, INVALID_STATE, VERSION_CONFLICT, RESOURCE_NOT_FOUND]
      responses:
        "200":
          description: Transaction updated
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/TransactionCreatedResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/ApiError" }
    delete:
      operationId: deleteTransaction
      summary: Soft-delete a transaction in the current user scope
      tags: [Finance]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      responses:
        "204": { description: Transaction soft-deleted; statistics exclude it }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
  /transactions/{id}/restore:
    post:
      operationId: restoreTransaction
      summary: Restore a soft-deleted transaction in the current user scope
      tags: [Finance]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      responses:
        "200":
          description: Transaction restored and included in statistics again
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionSummary" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
  /categories:
    get:
      operationId: listCategories
      summary: List categories in the current user scope
      tags: [Finance]
      parameters:
        - $ref: "#/components/parameters/CategoryKindQuery"
        - $ref: "#/components/parameters/IncludeArchived"
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategoryListResponse" }
    post:
      operationId: createCategory
      summary: Create a category in the current user scope
      tags: [Finance]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryCreateRequest" }
      x-error-codes: [VALIDATION_ERROR, DUPLICATE_RESOURCE]
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySummary" }
        "400": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /categories/{id}:
    patch:
      operationId: updateCategory
      summary: Update a category in the current user scope
      tags: [Finance]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      description: Archiving keeps historical transactions intact.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdateRequest" }
      x-error-codes: [VALIDATION_ERROR, VERSION_CONFLICT, DUPLICATE_RESOURCE]
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CategorySummary" }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/ApiError" }
  /financial-accounts:
    get:
      operationId: listFinancialAccounts
      summary: List financial accounts in the current user scope
      tags: [Finance]
      parameters:
        - $ref: "#/components/parameters/IncludeArchived"
      responses:
        "200":
          description: Financial accounts
          content:
            application/json:
              schema:
                { $ref: "#/components/schemas/FinancialAccountListResponse" }
    post:
      operationId: createFinancialAccount
      summary: Create a financial account in the current user scope
      tags: [Finance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/FinancialAccountCreateRequest" }
      x-error-codes: [VALIDATION_ERROR, DUPLICATE_RESOURCE]
      responses:
        "201":
          description: Financial account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialAccountSummary" }
        "400": { $ref: "#/components/responses/ApiError" }
        "409": { $ref: "#/components/responses/ApiError" }
  /financial-accounts/{id}:
    patch:
      operationId: updateFinancialAccount
      summary: Update a financial account in the current user scope
      tags: [Finance]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      description: Archiving keeps historical transactions intact.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              { $ref: "#/components/schemas/FinancialAccountUpdateRequest" }
      x-error-codes: [VALIDATION_ERROR, VERSION_CONFLICT, DUPLICATE_RESOURCE]
      responses:
        "200":
          description: Financial account updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinancialAccountSummary" }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/ApiError" }
  /budgets:
    get:
      operationId: listBudgets
      summary: List budgets in the current user scope
      tags: [Finance]
      parameters:
        - $ref: "#/components/parameters/Month"
        - $ref: "#/components/parameters/CategoryId"
      responses:
        "200":
          description: Budgets
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetListResponse" }
    post:
      operationId: createBudget
      summary: Create a budget in the current user scope
      tags: [Finance]
      description: One budget per user, month, and category (null = overall).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetCreateRequest" }
      x-error-codes: [VALIDATION_ERROR, DUPLICATE_RESOURCE, RESOURCE_NOT_FOUND]
      responses:
        "201":
          description: Budget created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetSummary" }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/ApiError" }
  /budgets/{id}:
    patch:
      operationId: updateBudget
      summary: Update a budget in the current user scope
      tags: [Finance]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BudgetUpdateRequest" }
      x-error-codes: [VALIDATION_ERROR, VERSION_CONFLICT, DUPLICATE_RESOURCE]
      responses:
        "200":
          description: Budget updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BudgetSummary" }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/ApiError" }
    delete:
      operationId: deleteBudget
      summary: Soft-delete a budget in the current user scope
      tags: [Finance]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      responses:
        "204": { description: Budget soft-deleted }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
  /finance/summary:
    get:
      operationId: getFinanceSummary
      summary: Get a fixed-point finance summary for the current user
      tags: [Finance]
      description: >-
        Computes confirmed expenses, refunds, net expense, income, today's
        spend, and budget progress for the Asia/Shanghai natural month.
      parameters:
        - $ref: "#/components/parameters/Month"
      responses:
        "200":
          description: Finance summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FinanceSummaryResponse" }
  /finance/export.csv:
    get:
      operationId: exportFinanceCsv
      summary: Export current-user finance data as CSV
      tags: [Finance]
      description: >-
        Exports confirmed, non-deleted transactions owned by the current user.
        The response is UTF-8 with BOM for Excel compatibility and a safe,
        deterministic attachment filename.
      parameters:
        - $ref: "#/components/parameters/Month"
        - $ref: "#/components/parameters/TransactionTypeQuery"
      responses:
        "200":
          description: UTF-8 CSV export with BOM
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            text/csv:
              schema: { type: string }
  /drafts/parse-text:
    post:
      operationId: parseTextDraft
      summary: Generate a draft suggestion from text without confirming it
      tags: [Drafts]
      description: >-
        Parses free-form text into a PENDING transaction draft. The draft is
        never counted in finance statistics until the user confirms it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ParseTextRequest" }
      x-error-codes: [VALIDATION_ERROR]
      responses:
        "201":
          description: PENDING draft created from parsed text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftCreatedResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
  /drafts/ocr:
    post:
      operationId: createOcrDraft
      summary: Generate a draft suggestion from OCR without confirming it
      tags: [Drafts]
      description: >-
        Recognizes text from a completed, scanned attachment and creates a
        PENDING draft. OCR failures return OCR_UNAVAILABLE and never block the
        manual transaction form.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OcrDraftRequest" }
      x-error-codes: [OCR_UNAVAILABLE, ATTACHMENT_NOT_READY, RESOURCE_NOT_FOUND]
      responses:
        "201":
          description: PENDING draft created from OCR text
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftCreatedResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/ApiError" }
        "503": { $ref: "#/components/responses/ApiError" }
  /drafts:
    get:
      operationId: listDrafts
      summary: List drafts in the current user scope
      tags: [Drafts]
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/DraftStatusQuery"
      responses:
        "200":
          description: Drafts owned by the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftListResponse" }
  /drafts/{id}:
    get:
      operationId: getDraft
      summary: Get a draft in the current user scope
      tags: [Drafts]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      responses:
        "200":
          description: Draft owned by the current user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftSummary" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
    patch:
      operationId: updateDraft
      summary: Update a draft in the current user scope
      tags: [Drafts]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DraftUpdateRequest" }
      x-error-codes: [DRAFT_NOT_EDITABLE, VERSION_CONFLICT]
      responses:
        "200":
          description: Draft updated while still PENDING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftSummary" }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/ApiError" }
  /drafts/{id}/confirm:
    post:
      operationId: confirmDraft
      summary: Confirm a draft before creating a formal record
      tags: [Drafts]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      x-error-codes: [INVALID_STATE, IDEMPOTENCY_CONFLICT, RESOURCE_NOT_FOUND]
      responses:
        "200":
          description: Already-confirmed draft replayed with its transaction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftConfirmResponse" }
        "201":
          description: Draft confirmed and CONFIRMED transaction created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DraftConfirmResponse" }
        "400": { $ref: "#/components/responses/ApiError" }
        "404": { $ref: "#/components/responses/ResourceNotFound" }
        "409": { $ref: "#/components/responses/ApiError" }
  /drafts/{id}/discard:
    post:
      operationId: discardDraft
      summary: Discard a draft in the current user scope
      tags: [Drafts]
      parameters: [{ $ref: "#/components/parameters/ResourceId" }]
      x-error-codes: [INVALID_STATE]
      responses:
        "204": { description: Draft discarded }
        "409": { $ref: "#/components/responses/ApiError" }
