<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>IndexedDB 迁移真机验证</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; line-height: 1.5; }
      main { max-width: 760px; margin: 0 auto; }
      button { display: block; width: 100%; margin: 10px 0; padding: 12px; font-size: 16px; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #f3f3f3; padding: 12px; border-radius: 8px; }
      .warning { padding: 12px; border: 1px solid currentColor; border-radius: 8px; }
    </style>
  </head>
  <body>
    <main>
      <h1>IndexedDB v1→v2 真机验证</h1>
      <p class="warning">本页面只用于测试。请分别在普通浏览器标签页和“添加到主屏幕”模式运行，并记录设备与系统版本。</p>
      <button id="run">运行完整迁移</button>
      <button id="reopen">关闭数据库后重新验证</button>
      <button id="clear">清除测试数据库</button>
      <button id="export">导出JSON证据</button>
      <pre id="output">等待执行</pre>
      <script type="module" src="./app.mjs"></script>
    </main>
  </body>
</html>
